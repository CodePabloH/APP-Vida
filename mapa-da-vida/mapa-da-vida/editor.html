<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Mapa da Vida: Editor e Celular</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: barra de ferramentas; abaixo, editor de código à esquerda e celular à direita (em tela estreita, vira abas). */
:root{--bg:#f3f4f6;--bar:#ffffff;--ink:#16181d;--mute:#5d6470;--line:#d9dce1;--acc:#0b7a4b;--on:#fff;--stage:#e4e6ea;--ed:#fbfbfc;--gut:#eef0f2;--gutink:#8b929d;--err:#b42318;--errbg:#fdecea;--ok:#0b7a4b;--shadow:0 20px 50px rgba(10,14,20,.28);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--bar:#16191e;--ink:#eceef1;--mute:#98a0ac;--line:#262a31;--acc:#39d98a;--on:#04170d;--stage:#0a0b0d;--ed:#12141a;--gut:#0f1116;--gutink:#5d6572;--err:#ff8a80;--errbg:#2a1412;--ok:#39d98a;--shadow:0 20px 50px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--bar:#16191e;--ink:#eceef1;--mute:#98a0ac;--line:#262a31;--acc:#39d98a;--on:#04170d;--stage:#0a0b0d;--ed:#12141a;--gut:#0f1116;--gutink:#5d6572;--err:#ff8a80;--errbg:#2a1412;--ok:#39d98a;--shadow:0 20px 50px rgba(0,0,0,.6);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;overflow:hidden}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding:10px max(16px,env(safe-area-inset-left,0px));background:var(--bar);border-bottom:1px solid var(--line)}
.bar label{display:grid;gap:3px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500}
select,input,button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:36px}
select{min-width:190px;max-width:100%}
input[type=number]{width:74px}
button{cursor:pointer;font-weight:500}
button:hover{border-color:var(--mute)}
button.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sz{display:flex;gap:6px;align-items:flex-end}
.sz[hidden],[hidden]{display:none!important}
.sp{flex:1}
.live{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:12.5px;min-height:36px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.live.busy i{background:#e8a33a}
.views{display:none;gap:6px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.ed{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;background:var(--bar);border-bottom:1px solid var(--line);padding:0 8px;align-items:center}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;font:500 12.5px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--mute);white-space:nowrap;min-height:0}
.tabs button.on{color:var(--ink);border-bottom-color:var(--acc)}
.tabs .tools{margin-left:auto;display:flex;gap:6px;padding:4px 0}
.tabs .tools button{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font:500 12px Inter,sans-serif;color:var(--ink)}
.code{position:relative;flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;background:var(--ed)}
#gut{margin:0;padding:12px 8px 12px 12px;background:var(--gut);color:var(--gutink);font:400 12.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;text-align:right;overflow:hidden;user-select:none;min-width:44px}
#src{margin:0;border:0;border-radius:0;background:var(--ed);color:var(--ink);padding:12px;font:400 12.5px/1.6 "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;resize:none;tab-size:2;min-height:0;outline:none;width:100%;height:100%}
#src:focus-visible{outline:none;box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--acc) 55%,transparent)}
.err{padding:8px 14px;background:var(--errbg);color:var(--err);font:500 12.5px "JetBrains Mono",ui-monospace,monospace;border-top:1px solid var(--line);max-height:84px;overflow:auto}
.okb{padding:6px 14px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);background:var(--bar)}
.ph{display:flex;flex-direction:column;min-width:0;min-height:0}
.info{padding:8px 14px;color:var(--mute);font-size:12.5px;border-bottom:1px solid var(--line);background:var(--bar)}
.info b{color:var(--ink);font-weight:600}
.stage{flex:1;min-height:0;overflow:auto;background:var(--stage);display:grid;place-items:center;padding:16px}
.slot{position:relative;flex:none}
.dev{position:absolute;left:0;top:0;transform-origin:0 0;background:#0b0c0e;box-shadow:var(--shadow),inset 0 0 0 2px #2a2d33}
.scr{position:relative;overflow:hidden;background:#000}
.sbar{position:relative;display:flex;justify-content:space-between;align-items:center;padding:0 18px;color:#fff;font:500 12px/1 Inter,system-ui,sans-serif;background:#000;z-index:2}
.sbar i{display:inline-flex;gap:5px;align-items:center;font-style:normal}
.bat{display:inline-block;width:20px;height:10px;border:1.5px solid #fff;border-radius:3px;position:relative}
.bat::before{content:"";position:absolute;inset:1.5px;right:5px;background:#fff;border-radius:1px}
.bat::after{content:"";position:absolute;right:-4px;top:2px;width:2px;height:4px;background:#fff;border-radius:0 1px 1px 0}
.sig{display:inline-flex;gap:1.5px;align-items:flex-end;height:10px}
.sig u{display:block;width:3px;background:#fff;border-radius:1px;text-decoration:none}
iframe{display:block;border:0;background:#000}
.cut{position:absolute;background:#000;z-index:3}
.drop{left:50%;top:0;width:46px;height:22px;margin-left:-23px;border-radius:0 0 23px 23px}
.punch{left:50%;top:8px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;box-shadow:0 0 0 2px #15171b}
.notch{left:50%;top:0;width:150px;height:30px;margin-left:-75px;border-radius:0 0 18px 18px}
.island{left:50%;top:9px;width:96px;height:28px;margin-left:-48px;border-radius:20px}
.pill{position:absolute;left:50%;bottom:7px;width:120px;height:4px;margin-left:-60px;border-radius:3px;background:#ffffffcc;z-index:3;pointer-events:none}
.hbtn{position:absolute;left:50%;bottom:11px;width:44px;height:44px;margin-left:-22px;border-radius:50%;border:2px solid #3a3d44}
.spk{position:absolute;left:50%;top:22px;width:56px;height:6px;margin-left:-28px;border-radius:4px;background:#25282d}
.cam{position:absolute;left:50%;top:8px;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1c1f24}
.btop{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;background:#23262b}
.btop s{display:block;width:11px;height:11px;border-radius:50%;background:#555a63;text-decoration:none}
.url{flex:1;margin-left:10px;height:24px;border-radius:12px;background:#15171b;color:#9aa1ad;font:400 12px/24px Inter,sans-serif;padding:0 12px;overflow:hidden;white-space:nowrap}
.load{position:absolute;inset:0;display:grid;place-items:center;background:var(--ed);color:var(--mute);z-index:5}
@media (max-width:900px){
  main{grid-template-columns:minmax(0,1fr)}
  .views{display:flex}
  main[data-view="code"] .ph{display:none}
  main[data-view="phone"] .ed{display:none}
  .ed{border-right:0}
}
</style>
</head>
<body>
<div class="bar">
  <label for="dev">Aparelho<select id="dev"></select></label>
  <div class="sz" id="szbox" hidden><label for="cw">Largura<input id="cw" type="number" min="200" max="2000" value="393"></label><label for="ch">Altura<input id="ch" type="number" min="200" max="2000" value="851"></label></div>
  <label for="zoom">Zoom<select id="zoom" style="min-width:104px"><option value="fit">Ajustar</option><option value="1">100%</option><option value="0.75">75%</option><option value="0.5">50%</option></select></label>
  <button id="rot" type="button">⟳ Girar</button>
  <button id="seed" type="button">Dados de exemplo</button>
  <button id="clear" type="button">Limpar dados</button>
  <span class="sp"></span>
  <div class="live" id="live"><i></i><span id="livet">Atualiza ao digitar</span></div>
  <div class="views"><button id="vcode" type="button">Código</button><button id="vphone" type="button">Celular</button></div>
</div>
<main id="main" data-view="code">
  <section class="ed" aria-label="Editor de código">
    <div class="tabs" id="tabs"></div>
    <div class="code"><div class="load" id="load">Carregando arquivos…</div><pre id="gut" aria-hidden="true">1</pre><textarea id="src" spellcheck="false" wrap="off" aria-label="Código do arquivo" autocapitalize="off" autocomplete="off"></textarea></div>
    <div class="err" id="err" hidden></div>
    <div class="okb" id="okb">Mude qualquer linha: o celular ao lado atualiza em meio segundo. Tab insere 2 espaços.</div>
  </section>
  <section class="ph" aria-label="Celular">
    <div class="info" id="info"></div>
    <div class="stage" id="stage"><div class="slot" id="slot"></div></div>
  </section>
</main>
<script>
(function(){
  var FILES=['index.html','style.css','app.js','estudos.js'],F={},O={},cur='estudos.js',$=function(i){return document.getElementById(i)};
  var st={id:'rn8',rot:false,zoom:'fit',cw:393,ch:851};
  // w,h = área do app em px CSS (sem a barra de status). bz = [topo, lados, base] da moldura.
  var D=[
    {id:'rn8',g:'Xiaomi',n:'Redmi Note 8',w:393,h:851,dpr:2.75,pol:'6,3"',cut:'drop',bz:[14,8,16],r:34,sb:28},
    {id:'rn8p',g:'Xiaomi',n:'Redmi Note 8 Pro',w:393,h:851,dpr:2.75,pol:'6,53"',cut:'punch',bz:[14,8,16],r:34,sb:28},
    {id:'s20',g:'Samsung',n:'Galaxy S20',w:360,h:800,dpr:3,pol:'6,2"',cut:'punch',bz:[10,6,12],r:36,sb:28},
    {id:'s20u',g:'Samsung',n:'Galaxy S20 Ultra',w:412,h:915,dpr:3.5,pol:'6,9"',cut:'punch',bz:[10,6,12],r:36,sb:28},
    {id:'fold',g:'Samsung',n:'Galaxy Fold (fechado)',w:280,h:653,dpr:3,pol:'4,6"',cut:'none',bz:[14,10,14],r:22,sb:24},
    {id:'px7',g:'Google',n:'Pixel 7',w:412,h:915,dpr:2.6,pol:'6,3"',cut:'punch',bz:[10,6,12],r:34,sb:28},
    {id:'se',g:'Apple',n:'iPhone SE',w:375,h:667,dpr:2,pol:'4,7"',cut:'btn',bz:[60,14,76],r:6,sb:20},
    {id:'ip14',g:'Apple',n:'iPhone 14',w:390,h:844,dpr:3,pol:'6,1"',cut:'notch',bz:[10,10,10],r:48,sb:47,bar:1},
    {id:'ip15p',g:'Apple',n:'iPhone 15 Pro',w:393,h:852,dpr:3,pol:'6,1"',cut:'island',bz:[10,10,10],r:50,sb:54,bar:1},
    {id:'ip14pm',g:'Apple',n:'iPhone 14 Pro Max',w:430,h:932,dpr:3,pol:'6,7"',cut:'island',bz:[10,10,10],r:52,sb:54,bar:1},
    {id:'ipad',g:'Tablet',n:'iPad Mini',w:768,h:1024,dpr:2,pol:'8,3"',cut:'cam',bz:[26,22,26],r:26,sb:0},
    {id:'nb',g:'Web',n:'Notebook 1280 × 720',w:1280,h:720,dpr:1,pol:'',cut:'browser',bz:[0,0,0],r:10,sb:0},
    {id:'cust',g:'Web',n:'Tamanho personalizado',w:393,h:851,dpr:1,pol:'',cut:'none',bz:[12,12,12],r:24,sb:0}
  ];
  try{var sv=JSON.parse(localStorage.getItem('pv-state'));if(sv&&D.some(function(d){return d.id===sv.id}))st=Object.assign(st,sv)}catch(e){}
  function saveSt(){try{localStorage.setItem('pv-state',JSON.stringify(st))}catch(e){}}
  var gs=[];D.forEach(function(d){if(gs.indexOf(d.g)<0)gs.push(d.g)});
  $('dev').innerHTML=gs.map(function(g){return '<optgroup label="'+g+'">'+D.filter(function(d){return d.g===g}).map(function(d){return '<option value="'+d.id+'">'+d.n+'</option>'}).join('')+'</optgroup>'}).join('');

  /* ===== Moldura do aparelho ===== */
  function now(){var d=new Date();return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
  function frame(){
    var d=D.find(function(x){return x.id===st.id}),W=d.w,H=d.h;
    if(d.id==='cust'){W=+st.cw||393;H=+st.ch||851}
    var rot=st.rot&&d.cut!=='browser';if(rot){var t=W;W=H;H=t}
    var sb=rot?0:d.sb,bz=d.bz.slice();
    if(rot){bz=[bz[1],bz[0]+2,bz[1]];if(d.cut==='btn')bz=[14,60,14]}
    var fw=W+bz[1]*2,fh=(d.cut==='browser'?38:sb)+H+bz[0]+bz[2],cut='';
    if(!rot&&['drop','punch','notch','island'].indexOf(d.cut)>=0)cut='<i class="cut '+d.cut+'"></i>';
    var sbar=sb?'<div class="sbar" style="height:'+sb+'px;'+(d.cut==='notch'||d.cut==='island'?'padding:0 28px;align-items:flex-end;padding-bottom:6px':'')+'"><span>'+now()+'</span><i><span class="sig"><u style="height:4px"></u><u style="height:6px"></u><u style="height:8px"></u><u style="height:10px"></u></span> 4G <span class="bat"></span></i></div>':'';
    var top=d.cut==='browser'?'<div class="btop"><s></s><s></s><s></s><div class="url">localhost / mapa-da-vida</div></div>':'';
    var extra=d.cut==='btn'&&!rot?'<div class="spk"></div><div class="hbtn"></div>':d.cut==='cam'&&!rot?'<div class="cam"></div>':'';
    var bar=d.bar&&!rot?'<div class="pill"></div>':'';
    $('slot').innerHTML='<div class="dev" id="dev0" style="width:'+fw+'px;height:'+fh+'px;padding:'+bz[0]+'px '+bz[1]+'px '+bz[2]+'px;border-radius:'+(d.cut==='browser'?d.r:d.r+Math.max.apply(null,bz)*.6)+'px">'+extra+'<div class="scr" style="width:'+W+'px;height:'+(fh-bz[0]-bz[2])+'px;border-radius:'+d.r+'px">'+cut+top+sbar+'<iframe id="app" title="Celular" style="width:'+W+'px;height:'+H+'px"></iframe>'+bar+'</div></div>';
    $('slot').dataset.w=fw;$('slot').dataset.h=fh;
    $('szbox').hidden=d.id!=='cust';
    $('info').innerHTML='<b>'+d.n+'</b> · '+W+' × '+H+' px'+(d.dpr>1?' · DPR '+String(d.dpr).replace('.',','):'')+(d.pol?' · tela '+d.pol:'');
    fit();run();
  }
  function fit(){
    var sl=$('slot'),w=+sl.dataset.w,h=+sl.dataset.h,s=st.zoom==='fit'?Math.min(1,($('stage').clientWidth-32)/w,($('stage').clientHeight-32)/h):+st.zoom;
    if(!(s>0))s=1;sl.style.width=Math.round(w*s)+'px';sl.style.height=Math.round(h*s)+'px';
    var d0=$('dev0');if(d0)d0.style.transform='scale('+s+')';
  }

  /* ===== Monta a página a partir dos arquivos e joga no celular ===== */
  var lastFile='';
  function esc(s){return s.replace(/<\/script/gi,'<\\/script')}
  function compose(keep){
    var h=F['index.html'];
    var hook='<script>onerror=function(m,s,l){parent.postMessage({pgerr:String(m)+(l?" (linha "+l+")":"")+(window.__f?" · "+window.__f:"")},"*");return true};addEventListener("unhandledrejection",function(e){parent.postMessage({pgerr:String(e.reason)},"*")})<\/script>';
    h=h.replace(/<link rel="stylesheet" href="style\.css">/,function(){return '<style>'+F['style.css']+'</style>'});
    h=h.replace(/<script src="app\.js"><\/script>/,function(){return hook+'<script>window.__f="app.js"<\/script><script>'+esc(F['app.js'])+'<\/script>'});
    h=h.replace(/<script src="estudos\.js"><\/script>/,function(){return '<script>window.__f="estudos.js"<\/script><script>'+esc(F['estudos.js'])+'<\/script>'+(keep?'<script>try{tab='+JSON.stringify(keep.tab)+';ss='+JSON.stringify(keep.ss)+';addEventListener("load",function(){scrollTo(0,'+(+keep.y||0)+')})}catch(e){}<\/script>':'')});
    return h;
  }
  var errList=[];
  function showErr(m){if(!m)errList=[];else if(errList.indexOf(m)<0&&errList.length<3)errList.push(m);var e=$('err');e.hidden=!errList.length;e.style.whiteSpace='pre-wrap';e.textContent=errList.length?'Erro: '+errList.join('\n→ ')+(errList.length>1?'\n(o primeiro costuma ser a causa)':''):''}
  function snap(){try{var w=$('app').contentWindow;return {tab:w.eval('tab'),ss:w.eval('ss'),y:w.scrollY}}catch(e){return null}}
  function run(fresh){var f=$('app');if(!f)return;var k=fresh===true?null:snap();showErr('');f.srcdoc=compose(k);setLive(false)}
  addEventListener('message',function(e){if(e.data&&e.data.pgerr)showErr(e.data.pgerr)});
  var tm=null;
  function setLive(b){$('live').classList.toggle('busy',b);$('livet').textContent=b?'Atualizando…':'Atualizado '+now()}
  function schedule(){setLive(true);clearTimeout(tm);tm=setTimeout(run,450)}

  /* ===== Editor ===== */
  var src=$('src'),gut=$('gut');
  function lines(){var n=src.value.split('\n').length,s='';for(var i=1;i<=n;i++)s+=i+'\n';gut.textContent=s}
  function openFile(n){
    cur=n;src.value=F[n];lines();src.scrollTop=src.scrollLeft=0;gut.scrollTop=0;
    $('tabs').querySelectorAll('button[data-f]').forEach(function(b){b.classList.toggle('on',b.dataset.f===n)});
    $('okb').textContent=O[n]===F[n]?'Arquivo igual ao original.':'Você alterou este arquivo. Use “Copiar” para levar o código, ou “Restaurar” para voltar ao original.';
  }
  function persist(){try{var ed={},base={};FILES.forEach(function(f){if(F[f]!==O[f]){ed[f]=F[f];base[f]=O[f]}});localStorage.setItem('pg-files2',JSON.stringify({ed:ed,base:base}))}catch(e){}}
  src.addEventListener('input',function(){F[cur]=src.value;lines();persist();$('okb').textContent=O[cur]===F[cur]?'Arquivo igual ao original.':'Você alterou este arquivo. Use “Copiar” para levar o código, ou “Restaurar” para voltar ao original.';schedule()});
  src.addEventListener('scroll',function(){gut.scrollTop=src.scrollTop});
  src.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=src.selectionStart,t=src.selectionEnd;src.setRangeText('  ',s,t,'end');src.dispatchEvent(new Event('input'))}});
  function tabs(){
    $('tabs').innerHTML=FILES.map(function(f){return '<button type="button" data-f="'+f+'">'+f+(O[f]!==F[f]?' •':'')+'</button>'}).join('')+'<div class="tools"><button type="button" id="sv" class="pri">Salvar no projeto</button><button type="button" id="cp">Copiar</button><button type="button" id="rs">Restaurar</button></div>';
    $('tabs').querySelectorAll('button[data-f]').forEach(function(b){b.onclick=function(){openFile(b.dataset.f)}});
    $('cp').onclick=function(){var b=this;function ok(){b.textContent='Copiado ✓';setTimeout(function(){b.textContent='Copiar'},1400)}
      try{navigator.clipboard.writeText(F[cur]).then(ok,function(){src.select();b.textContent='Selecionado: Ctrl+C'})}catch(e){src.select();b.textContent='Selecionado: Ctrl+C'}};
    $('sv').onclick=save;
    $('rs').onclick=function(){F[cur]=O[cur];persist();openFile(cur);tabs();$('tabs').querySelector('[data-f="'+cur+'"]').classList.add('on');run()};
  }
  src.addEventListener('input',function(){var b=$('tabs').querySelector('[data-f="'+cur+'"]');if(b)b.textContent=cur+(O[cur]!==F[cur]?' •':'')});

  /* ===== Salvar direto no arquivo (o servidor do projeto grava) ===== */
  function save(){
    var b=$('sv'),f=cur,txt=F[cur];
    fetch('/__save/'+f,{method:'POST',headers:{'Content-Type':'text/plain; charset=utf-8'},body:txt}).then(function(r){
      if(!r.ok)throw new Error(r.status);O[f]=txt;persist();b.textContent='Salvo ✓';
      $('okb').textContent=f+' salvo na pasta do projeto.';tabs();openFile(f);$('tabs').querySelector('[data-f="'+f+'"]').classList.add('on');
      setTimeout(function(){var x=$('sv');if(x)x.textContent='Salvar no projeto'},1500);
    }).catch(function(){b.textContent='Não salvou';showErr('Não consegui salvar. Abra o editor pelo servidor do projeto (iniciar.bat).');setTimeout(function(){b.textContent='Salvar no projeto'},2000)});
  }
  addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save()}});

  /* ===== Dados de exemplo para ver os gráficos cheios ===== */
  function pad(n){return ('0'+n).slice(-2)}
  function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
  function ago(n){var d=new Date();d.setDate(d.getDate()-n);return dk(d)}
  function seed(){
    var M=[['pt','Língua Portuguesa','#2ECC71',['Crase','Concordância','Interpretação']],['dc','Direito Constitucional','#3B82F6',['Direitos fundamentais']],['mt','Matemática','#F59E0B',['Porcentagem','Razão']],['ni','Noções de Informática','#94A3B8',[]],['rl','Raciocínio Lógico','#A855F7',[]]];
    var mats=M.map(function(m){return {id:m[0],name:m[1],color:m[2],topics:m[3].map(function(t,i){return {id:m[0]+i,name:t}})}}),sess=[],qs=[],rev=[],i=0;
    function add(mid,tid,sec,d){sess.push({id:'s'+(i++),d:ago(d),mid:mid,tid:tid,s:'x',m:Math.max(1,Math.round(sec/60)),sec:sec})}
    add('pt','pt0',5400,0);add('pt','pt1',4800,1);add('pt','',4429,3);add('dc','dc0',5200,0);add('dc','',3543,2);add('mt','mt0',2400,1);add('mt','mt1',1611,4);add('ni','',2709,2);add('rl','',440,5);
    for(var d=0;d<28;d++){if(d%3===2)continue;var n=15+((d*7)%20),c=Math.round(n*(0.55+0.012*(28-d)));qs.push({id:'q'+d,d:ago(d),mid:d%2?'pt':'mt',tid:'',s:'x',n:n,c:Math.min(n,c)})}
    rev.push({id:'r1',mid:'pt',tid:'pt0',s:'x',base:ago(8),d:ago(1),n:1,done:false},{id:'r2',mid:'mt',tid:'mt0',s:'x',base:ago(7),d:ago(0),n:2,done:false},{id:'r3',mid:'dc',tid:'',s:'x',base:ago(0),d:ago(-7),n:2,done:false});
    return {mats:mats,sess:sess,qs:qs,rev:rev,mig2:1,sel:{},arev:true,timer:{run:false,start:0,acc:0}};
  }
  function store(v){var f=$('app');try{if(v===null)f.contentWindow.localStorage.removeItem('mapa-vida-v1');else f.contentWindow.localStorage.setItem('mapa-vida-v1',JSON.stringify(v))}catch(e){showErr('Este navegador bloqueou o armazenamento do app, então os dados de exemplo não puderam ser gravados.')}run()}
  $('seed').onclick=function(){store(seed())};
  $('clear').onclick=function(){store(null)};

  /* ===== Controles ===== */
  $('dev').value=st.id;$('zoom').value=st.zoom;$('cw').value=st.cw;$('ch').value=st.ch;
  $('dev').onchange=function(){st.id=this.value;st.rot=false;saveSt();frame()};
  $('zoom').onchange=function(){st.zoom=this.value;saveSt();fit()};
  $('rot').onclick=function(){st.rot=!st.rot;saveSt();frame()};
  ['cw','ch'].forEach(function(i){$(i).oninput=function(){st[i]=+this.value;saveSt();frame()}});
  function view(v){$('main').dataset.view=v;if(v==='phone')setTimeout(fit,0)}
  $('vcode').onclick=function(){view('code')};$('vphone').onclick=function(){view('phone')};
  addEventListener('resize',fit);

  /* ===== Início: carrega os arquivos do app ===== */
  Promise.all(FILES.map(function(f){return fetch(f+'?t='+Date.now()).then(function(r){if(!r.ok)throw new Error(f);return r.text()})})).then(function(a){
    FILES.forEach(function(f,i){O[f]=a[i];F[f]=a[i]});
    try{var s=JSON.parse(localStorage.getItem('pg-files2'));if(s)FILES.forEach(function(f){if(typeof s.ed[f]==='string'&&s.base[f]===O[f])F[f]=s.ed[f]})}catch(e){}
    $('load').hidden=true;tabs();openFile(cur);frame();
  }).catch(function(e){$('load').innerHTML='<div style="max-width:380px;padding:20px;line-height:1.6"><b>Não consegui abrir os arquivos ('+e.message+').</b><br>Este editor precisa do servidor do projeto. Dê dois cliques em <b>iniciar.bat</b> (Windows) ou rode <b>node dev-server.js</b>. Ele abre esta página sozinho.</div>'});
})();
